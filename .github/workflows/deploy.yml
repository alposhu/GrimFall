# Build Grimfall and publish it to GitHub Pages on every push to main.
#
# Nothing needs to be committed from dist/ - it is built here. That is why
# dist/ stays in .gitignore: the repository holds the sources, and the site is
# produced from them, so the two can never drift apart.
#
# One-time setup in the repository: Settings -> Pages -> Source: GitHub Actions.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:        # so it can also be run by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let a newer push cancel an in-flight older one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 22, not 20: the co-op tests drive the real client module, which opens a
      # WebSocket. Node grew a global `WebSocket` in 22 — on 20 there is none,
      # so those two suites failed here while passing on any developer machine
      # with a current Node. (20 also left maintenance in April 2026.)
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Creates the Pages site if it does not exist yet. Without this the
      # deploy step fails with a 404 on a repository where Pages has never
      # been switched on — which looks like a broken workflow rather than a
      # setting nobody has touched.
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # The suite is the gate. A build that fails its own tests should not
      # become the thing players are looking at.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
